# YOLO Dataset configuration for Millipede Segment/Ring Counting
path: . # dataset root directory (relative to yaml file or absolute)
train: train/images
val: val/images
test: test/images

# Class names
names:
  0: segment   # individual body ring / annulus
  1: head      # cranial capsule / collum
  2: telson    # anal valves / posterior end
